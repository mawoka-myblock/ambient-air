[package]
edition      = "2024"
name         = "firmware"
rust-version = "1.87"
version      = "0.1.0"

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"

[dependencies]
async-icp20100 = {path= "../async-icp20100"}
async-stcc4 = {path= "../async-stcc4"}
sgp40 = {path = "../sgp40"}
aht20 = {path="../aht20"}
bq27441 = { path = "../bq27441" }

embedded-hal-bus = {version = "*", features = ["async", "defmt-03"]}

defmt = "1.0.1"
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32c3", "defmt"] }
esp-hal = { version = "1", features = [
  "defmt",
  "esp32c3",
  "unstable",
] }

bt-hci = { version = "0.6", features = ["uuid"] }
critical-section = "1.2.0"
embassy-executor = { version = "0.9", features = [
  "defmt",
  # "rtos-trace"
] }
embassy-time = { version = "0.5", features = ["defmt"] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7", features = ["defmt"] }
esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-backtrace = { version = "0.18", features = [
  "defmt",
  "esp32c3",
  "panic-handler",
] }
esp-rtos = { version = "0.2", features = ["defmt", "esp32c3", "embassy", "esp-radio", "esp-alloc"] }
esp-println = { version = "0.16", features = ["defmt-espflash", "esp32c3"] }
static_cell = "2.1.1"
trouble-host = { version = "0.5", features = ["gatt", "derive", "defmt"] }

embassy-sync = { version = "0.7.2" }
embassy-embedded-hal = { version = "0.5" }
embassy-futures = { version = "*" }
esp-radio = { version = "0.17", features = [
  "ble",
  "defmt",
  "esp-alloc",
  "esp32c3",
  "unstable"
]  }
portable-atomic = { version = "1.11.1", default-features = false }
tickv = { version = "2" }
esp-storage = {version  = "*", features = ["esp32c3"]}
anyhow = {version = "*", default-features = false}
embedded-storage = {version = "*"}
bytemuck = {version = "*", features = ["derive"]}
async-button = {version = "0.2"}
serde = {version = "1", default-features = false, features = ["derive"]}
serde-json-core = {version = "0.6"}
heapless = { version = "0.9", features = ["serde"] }
jiff = { version = "0.2", default-features = false, features = ["serde", "alloc"] }
num_enum = { version = "0.7", default-features = false }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

# [package.metadata.espflash.idf]
# partition_table = "./partition-table.bin"
